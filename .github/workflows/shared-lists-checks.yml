name: Shared lists checks
on:
  pull_request:
    paths:
      - 'shared/checklists*'
      - 'server/routes/lists.mjs'
      - 'src/features/chat/**'
      - 'src/LiveMessageComposer.tsx'
      - '.github/workflows/shared-lists-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
